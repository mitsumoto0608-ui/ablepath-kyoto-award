[project]
name = "ablepath-kyoto-award"
version = "0.2.0"
description = "清水・祇園 観光×地震・火災・大雨 検証ツール（シナリオ計算エンジン）— PLATEAU AWARD 2026"
requires-python = ">=3.10"
