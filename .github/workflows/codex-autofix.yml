name: Manual autofix diagnostic (read-only)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Non-main branch to diagnose"
        required: true
        default: "integration/overnight-multicity-20260830"
        type: string

permissions:
  contents: read

concurrency:
  group: autofix-diagnostic-${{ github.repository }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject main and unscoped branches
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          case "$TARGET_BRANCH" in
            integration/*|task/*) ;;
            *) echo "Only integration/* or task/* may be diagnosed."; exit 1 ;;
          esac
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install trusted declared dependencies
        run: |
          python -m pip install --disable-pip-version-check -r scripts/overnight/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Create sanitized diagnostic packet
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q > pytest.raw.log 2>&1
          status=$?
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("pytest.raw.log").read_text(encoding="utf-8", errors="replace")[-20000:]
          text = re.sub(r"(?i)(api[_-]?key|token|password|secret)\s*[:=]\s*\S+", r"\1=[REDACTED]", text)
          text = re.sub(r"[A-Za-z]:\\Users\\[^\\\s]+", "[LOCAL_PATH]", text)
          Path("pytest.sanitized.log").write_text(text, encoding="utf-8", newline="\n")
          PY
          {
            echo "# PR_READY diagnostic"
            echo
            echo "This workflow is intentionally read-only. It does not call an external agent, commit, push, or open a PR."
            echo "A human must review the sanitized log and explicitly authorize any future external-agent egress/write workflow."
            echo
            echo "pytest exit code: $status"
          } > PR_READY.md
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: autofix-diagnostic-${{ github.run_id }}
          path: |
            PR_READY.md
            pytest.sanitized.log
          retention-days: 7
