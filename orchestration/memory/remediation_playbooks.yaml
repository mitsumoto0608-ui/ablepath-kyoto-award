playbook_schema_version: 1.0.0
playbooks:
  - playbook_id: collect-only-before-full-v1
    trigger: multiple independently developed pytest roots are integrated
    actions:
      - run collect-only over the newly integrated roots
      - add explicit package boundaries when module names collide
      - run the unchanged full suite after repair
    protected_boundaries: [test_coverage, expected_values, main, baseline_tag]
    confidence: MEDIUM
    human_approved: false
  - playbook_id: cross-pack-schema-gate-v1
    trigger: UI/static catalog and shared city-pack runtime are integrated
    actions:
      - compare source IDs and scenario IDs exactly
      - compare closed hazard vocabulary exactly
      - preserve UNKNOWN and metadata-only classes
      - run unit build and E2E gates
    protected_boundaries: [UNKNOWN_semantics, official_data_interpretation, exact_schema]
    confidence: MEDIUM
    human_approved: false
  - playbook_id: local-pr-ready-v1
    trigger: push or PR is unavailable
    actions:
      - do not bypass authentication or safety review
      - finish local verification and release archive
      - create reports/PR_READY.md
      - stop for human review
    protected_boundaries: [credentials, external_writes, main, baseline_tag]
    confidence: LOW
    human_approved: false
  - playbook_id: private-free-plan-main-protection-fallback-v1
    trigger: GitHub private-plan ruleset or branch-protection capability returns the known HTTP 403 fingerprint
    actions:
      - do not retry the same ruleset or classic branch-protection APIs until capability changes
      - report SERVER_SIDE_BRANCH_PROTECTION=false without implying equivalence
      - install and verify the versioned local pre-push accident-prevention hook
      - use isolated worktrees and only task/**, integration/**, or release/** branches
      - require draft PR, Hosted CI, and human-only main merge
      - reject main, every tag, deletion, non-fast-forward, malformed, or unavailable-object push locally
    protected_boundaries: [main, baseline_tag, credentials, server_protection_truth, human_merge_gate]
    confidence: HIGH
    human_approved: false
  - playbook_id: recreate-external-venv-from-project-metadata-v1
    trigger: an external virtualenv launcher is stale or incompatible
    actions:
      - discard no repository files and change no dependency metadata
      - create a new virtualenv outside the repository
      - install the project from its declared development metadata
      - run the unchanged tests
    protected_boundaries: [pyproject, lockfiles, repository_venv, expected_values]
    confidence: MEDIUM
    human_approved: false
  - playbook_id: unique-external-pytest-basetemp-v1
    trigger: pytest default base temporary directory is inaccessible
    actions:
      - select a unique writable base temporary directory outside the repository
      - disable cacheprovider when cache writes are not required by the acceptance gate
      - run targeted tests before the unchanged full suite
    protected_boundaries: [tests, expected_values, repository_files]
    confidence: MEDIUM
    human_approved: false
  - playbook_id: fresh-install-fixture-normalization-v1
    trigger: a disposable installer test claims a fresh lifecycle while a prior fixture hook exists
    actions:
      - fingerprint the fixture lifecycle separately from repository behavior
      - remove only the disposable pre-existing hook before the fresh-install action
      - run targeted guard tests and then the unchanged full suite
      - leave the real installed hook and protection claims unchanged
    protected_boundaries: [real_git_hooks, server_protection_truth, expected_guard_behavior]
    confidence: HIGH
    human_approved: false
  - playbook_id: validated-geometry-capability-chain-v1
    trigger: metadata hashes or caller-supplied scenario fields are being treated as geometry-connection authority
    actions:
      - distinguish hash-bound artifact metadata from validated connectable geometry
      - issue a geometry capability only after strict canonical geometry and lineage validation
      - bind edge identity, official artifact source IDs, feature hazard types, and immutable payload bytes
      - repeat the relationship checks at every public derive and deserialize boundary
      - preserve UNKNOWN when coverage, depth, closure, or policy authority is absent
    protected_boundaries: [UNKNOWN_semantics, official_data_interpretation, source_provenance, safety_state]
    confidence: HIGH
    human_approved: false
  - playbook_id: stdlib-schema-structural-precheck-v1
    trigger: schema verification needs semantic mutation coverage but adding a validator dependency is prohibited
    actions:
      - parse the schema with the standard library
      - assert its exact field and conditional constraint surface
      - evaluate only the fixture's declared keyword subset in tests
      - retain runtime relational validation as normative
      - do not change dependency metadata
    protected_boundaries: [dependencies, exact_schema, runtime_contract]
    confidence: MEDIUM
    human_approved: false
  - playbook_id: calendar-valid-provenance-time-v1
    trigger: a timestamp passes lexical validation but may not be a real calendar instant
    actions:
      - validate the exact required UTC lexical form
      - parse year month day and time for calendar validity
      - reject offsets or fractional forms outside the contract
      - add impossible-date negative tests
    protected_boundaries: [source_provenance, temporal_truth]
    confidence: HIGH
    human_approved: false
